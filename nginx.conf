map $arg_v $dli_asset_cache {
  default "public, max-age=604800, stale-while-revalidate=86400, stale-if-error=604800";
  "~.+"  "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Legacy soft-404 route: the old /ai/ page no longer exists. Send it home rather
  # than serving the homepage with a 200 at a stale URL.
  location = /ai { return 301 /; }
  location = /ai/ { return 301 /; }
  location = /home { return 301 /; }

  location = /robots.txt {
    expires 1h;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    expires 1h;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
  }

  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }

  location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|gif|webp|svg|ico|json|pdf|webm|mp4)$ {
    add_header Cache-Control $dli_asset_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
